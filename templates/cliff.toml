# The CHANGELOG.md of every Laplace repository is generated from its commit titles with this
# configuration, by tools/changelog.sh. A squashed pull request lands as one commit titled like
# the pull request, so a changelog entry is a pull request title.

[changelog]
header = """
# Changelog

What changed in each release, generated from the commit titles on `main`. Regenerate it with
`tools/changelog.sh` from [MasterLaplace/.github](https://github.com/MasterLaplace/.github);
an edit by hand is lost at the next release, whose check refuses a file that differs from
what the history gives.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
{{ "\n" }}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^style", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 00 -->Breaking" },
    { message = "^feat", group = "<!-- 01 -->Added" },
    { message = "^fix", group = "<!-- 02 -->Fixed" },
    { message = "^perf", group = "<!-- 03 -->Performance" },
    { message = "^refactor", group = "<!-- 04 -->Changed" },
    { message = "^revert", group = "<!-- 05 -->Reverted" },
    { message = "^docs", group = "<!-- 06 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 07 -->Build and CI" },
    { message = "^test", group = "<!-- 08 -->Tests" },
    { message = "^chore", group = "<!-- 09 -->Housekeeping" },
    { message = ".*", group = "<!-- 10 -->Other" },
]
