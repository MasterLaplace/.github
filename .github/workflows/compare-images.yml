name: compare-images

on:
  push:
    branches: [main]
    paths:
      - "actions/compare-images/**"
      - ".github/workflows/compare-images.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "tools/compare-images.py"
      - "tools/publish-images.sh"
      - "tools/test-compare-images.sh"
      - "actions/compare-images/**"
      - ".github/workflows/compare-images.yml"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the comparison and the images branch
        run: tools/test-compare-images.sh

  action:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        uses: ./actions/compare-images/scope
      - name: Draw three images, two of which a merge commit draws differently, and compare them
        if: steps.scope.outputs.run == 'true' || steps.scope.outputs.closed == 'true'
        uses: ./actions/compare-images
        with:
          title: Action self-test
          before: ${{ steps.scope.outputs.before }}
          comment-when: always
          draw: >-
            python3 -c 'import os, subprocess;
            d = os.environ["IMAGES_DIR"];
            merge = subprocess.run(["git", "rev-parse", "--verify", "--quiet", "HEAD^2"], capture_output=True).returncode == 0;
            pixel = lambda x, y, shade: (x * 4, y * 6, 128 + (shade if 20 <= x < 44 and 10 <= y < 30 else 0));
            image = lambda shade: b"P6\n64 40\n255\n" + bytes(v for y in range(40) for x in range(64) for v in pixel(x, y, shade));
            open(d + "/same.ppm", "wb").write(image(0));
            open(d + "/square.ppm", "wb").write(image(80 if merge else 0));
            merge and open(d + "/only-on-a-merge.ppm", "wb").write(image(40))'
