name: config.h template

on:
  pull_request:
    paths:
      - "templates/config.h"
      - "tools/check-config-header.sh"
      - "tools/test-config-header.sh"
      - ".github/workflows/config-template.yml"
  push:
    branches: [main]
    paths:
      - "templates/config.h"
      - "tools/check-config-header.sh"
      - "tools/test-config-header.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang
        run: sudo apt-get update -q && sudo apt-get install -y -q clang
      - name: Test the template and the check
        run: tools/test-config-header.sh
