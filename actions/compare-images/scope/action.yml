name: Decide whether a pull request can change the images
description: >-
  Answers whether the images compare-images draws need comparing on this pull request: when it
  touches a file the paths pattern matches, when it carries the label, or when it was closed, for
  the cleanup. Run it before the setup the drawing needs, so a pull request that changes nothing
  drawn skips that setup too. The checkout must hold the base commit (fetch-depth: 0).

inputs:
  paths:
    description: >-
      An extended regular expression over the files the pull request changes; empty matches any
      pull request.
    default: ""
  label:
    description: A label that asks for the comparison on any pull request; empty for none.
    default: ""
  base:
    description: The commit the pull request is compared with.
    default: ${{ github.event.pull_request.base.sha }}

outputs:
  run:
    description: true when the images must be drawn and compared.
    value: ${{ steps.scope.outputs.run }}
  labelled:
    description: true when the label asked for the comparison.
    value: ${{ steps.scope.outputs.labelled }}
  closed:
    description: true when the pull request was closed, and only the cleanup runs.
    value: ${{ steps.scope.outputs.closed }}

runs:
  using: composite
  steps:
    - name: Decide
      id: scope
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        LABEL: ${{ inputs.label }}
        BASE: ${{ inputs.base }}
        ACTION: ${{ github.event.action }}
        ADDED: ${{ github.event.label.name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        labelled=false
        if [ -n "$LABEL" ] && printf '%s' "$LABELS" | grep -qF "\"$LABEL\""; then labelled=true; fi
        echo "labelled=$labelled" >>"$GITHUB_OUTPUT"
        if [ "$ACTION" = closed ]; then
          echo "closed=true" >>"$GITHUB_OUTPUT"
          echo "run=false" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        echo "closed=false" >>"$GITHUB_OUTPUT"
        if [ "$ACTION" = labeled ] && [ "$ADDED" != "$LABEL" ]; then
          echo "run=false" >>"$GITHUB_OUTPUT"
          echo "Another label was added: nothing to draw." >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$labelled" = true ] || [ -z "$PATHS" ] || git diff --name-only "$BASE"...HEAD | grep -qE -- "$PATHS"; then
          echo "run=true" >>"$GITHUB_OUTPUT"
        else
          echo "run=false" >>"$GITHUB_OUTPUT"
          echo "No file this pull request changes can change an image." >>"$GITHUB_STEP_SUMMARY"
        fi
